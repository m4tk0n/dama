name: Deploy to Webzdarma

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dama-ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: FTP deploy and HTTP health check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PHP and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l index.php
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find assets/js -type f -name '*.js' -print0)
          node --experimental-default-type=module --test tests/*.test.mjs
          for file in pages/*.html; do
            test -s "$file"
          done

      - name: Resolve FTP server to IPv4
        id: ftp_ipv4
        shell: bash
        run: |
          set -euo pipefail
          FTP_IPV4="$(getent ahostsv4 ftp4.webzdarma.cz | awk 'NR == 1 { print $1 }')"
          if [ -z "$FTP_IPV4" ]; then
            echo "Could not resolve ftp4.webzdarma.cz to IPv4" >&2
            exit 1
          fi
          echo "Using FTP IPv4 address: $FTP_IPV4"
          echo "server=$FTP_IPV4" >> "$GITHUB_OUTPUT"

      - name: Sync changed files to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ steps.ftp_ipv4.outputs.server }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /dama/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.env
            **/.env.*
            .env
            .env.*

      - name: Verify deployed application
        shell: bash
        run: |
          set -euo pipefail
          URL="https://7x.wz.cz/dama/"
          HTTP_STATUS="$(curl --silent --show-error --location --max-time 30 --output deployed-page.html --write-out '%{http_code}' "$URL")"
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            cat deployed-page.html
            exit 1
          fi
          if ! grep -qi '<title>Dáma</title>' deployed-page.html; then
            echo "The deployed response does not contain the expected Dáma page title." >&2
            exit 1
          fi
          echo "### Deployment health check" >> "$GITHUB_STEP_SUMMARY"
          echo "- HTTP status: $HTTP_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Page title: Dáma" >> "$GITHUB_STEP_SUMMARY"
