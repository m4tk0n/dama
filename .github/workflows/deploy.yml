name: Deploy to Webzdarma

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dama-ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: FTP deploy and server diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve FTP server to IPv4
        id: ftp_ipv4
        shell: bash
        run: |
          set -euo pipefail
          FTP_IPV4="$(getent ahostsv4 ftp4.webzdarma.cz | awk 'NR == 1 { print $1 }')"
          if [ -z "$FTP_IPV4" ]; then
            echo "Could not resolve ftp4.webzdarma.cz to IPv4" >&2
            exit 1
          fi
          echo "Using FTP IPv4 address: $FTP_IPV4"
          echo "server=$FTP_IPV4" >> "$GITHUB_OUTPUT"

      - name: Sync changed files to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ steps.ftp_ipv4.outputs.server }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /web/dama/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.env
            **/.env.*
            .env
            .env.*

      - name: Read PHP and MySQL versions from live server
        shell: bash
        run: |
          set -euo pipefail
          URL="https://7x.wz.cz/dama/server-info.php"
          HTTP_STATUS="$(curl --silent --show-error --location --max-time 30 --output server-info-result.txt --write-out '%{http_code}' "$URL")"
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            cat server-info-result.txt
            exit 1
          fi
          echo '### Live server PHP/MySQL diagnostics' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\\n' '\x60\x60\x60text' >> "$GITHUB_STEP_SUMMARY"
          tee -a "$GITHUB_STEP_SUMMARY" < server-info-result.txt
          printf '%s\\n' '\x60\x60\x60' >> "$GITHUB_STEP_SUMMARY"

      - name: Save diagnostics as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dama-server-info
          path: server-info-result.txt
          if-no-files-found: error
          retention-days: 7
