<section class="screen" aria-labelledby="create-title"><div class="content-panel">

<p class="eyebrow">Nová partie</p><h1 id="create-title">Vytvořit místní hru</h1>
<div class="field-group"><label for="game-variant">Varianta hry</label><select id="game-variant">
<optgroup label="Klasické varianty">
<option value="classic">Klasická dáma – 8×8</option>
<option value="giveaway">Žravá dáma – 8×8</option>
</optgroup>
<optgroup label="České varianty">
<option value="czech-8" selected>Česká dáma podle ČFD – 8×8</option>
<option value="czech-zapletal">Česká dáma dle Zapletala – 8×8</option>
</optgroup>
<optgroup label="Národní a mezinárodní varianty">
<option value="english" disabled>Anglická dáma – 8×8</option>
<option value="international-10" disabled>Mezinárodní dáma – 10×10</option>
<option value="brazilian" disabled>Brazilská dáma – 8×8</option>
<option value="spanish" disabled>Španělská dáma – 8×8</option>
<option value="turkish" disabled>Turecká (Keny) dáma</option>
</optgroup>
<optgroup label="Další varianty uvedené na Wikipedii">
<option value="corner" disabled>Rohová dáma</option>
<option value="twenty-ten" disabled>Dvacet proti deseti</option>
<option value="medieval-battle" disabled>Středověká bitva</option>
<option value="knight" disabled>Jezdecká dáma</option>
<option value="dam" disabled>Dám</option>
<option value="canadian" disabled>Kanadská dáma</option>
<option value="double" disabled>Dvojitá dáma</option>
</optgroup>
</select><small class="muted-note">Vybrat lze pouze varianty s dokončeným herním enginem. Ostatní varianty jsou dočasně deaktivované a zpřístupní se po dokončení a otestování.</small></div>
<fieldset class="field-group"><legend>Proti komu chcete hrát?</legend>
<label class="choice-row"><input type="radio" name="opponent" value="human" checked> Dva hráči na jednom zařízení</label>
<label class="choice-row"><input type="radio" name="opponent" value="ai"> Proti počítači</label></fieldset>
<fieldset class="field-group" id="difficulty-group" hidden><legend>Obtížnost počítače</legend>
<label class="choice-row"><input type="radio" name="difficulty" value="easy" checked> Lehká</label>
<label class="choice-row"><input type="radio" name="difficulty" value="medium"> Střední</label>
<label class="choice-row"><input type="radio" name="difficulty" value="hard"> Těžká</label></fieldset>
<button class="button button-primary button-wide" type="button" data-action="start-local">Pokračovat</button>
</div><div class="back-action"><button class="button back-button" type="button" data-screen="home">← Zpět</button></div></section>
